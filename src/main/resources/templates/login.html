<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title><link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<main class="panel">
  <h1>Log in</h1>
  <p class="notice error" th:if="${param.error}">Incorrect username or password. Please try again.</p>
  <p class="notice success" th:if="${param.registered}">Account created. You can now log in.</p>
  <p class="notice success" th:if="${param.logout}">You have been logged out.</p>
  <form th:action="@{/login}" method="post">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
  </form>
  <p>New here? <a th:href="@{/register}">Create an account</a></p>
</main>
</body></html>

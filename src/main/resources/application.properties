spring.application.name=RecQ

# Shared persistence for Epic 3. H2 is an iteration-1 demo default.
# Set SPRING_DATASOURCE_URL / USERNAME / PASSWORD for shared PostgreSQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:recq;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Demo courts are examples only. Disable when actual session data is available.
recq.demo.seed=${RECQ_DEMO_SEED:false}
